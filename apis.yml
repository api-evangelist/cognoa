aid: cognoa
name: Cognoa
description: 'Cognoa is a pediatric behavioral health company in Palo Alto, California
  building digital diagnostics and therapeutics for early childhood development, starting
  with autism. Its flagship product, Canvas Dx, is an FDA-authorized Software as a
  Medical Device that aids clinicians in diagnosing or ruling out autism spectrum disorder
  in children aged 18 to 72 months, combining a caregiver questionnaire, short home
  videos scored by credentialed human video analysts, and a healthcare-provider questionnaire
  into a machine-learning classifier that returns Positive, Negative, or Indeterminate.
  Canvas Dx is delivered as an iOS/Android caregiver app plus a prescriber web portal
  at app.cognoa.com; Cognoa ships no public developer API, SDK, or webhook surface.'
