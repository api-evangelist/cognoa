  detail: >-
    Cognoa ships Canvas Dx only as an end-user medical device — a caregiver iOS/Android
    app and a prescriber web portal at app.cognoa.com — with no developer portal, no
    published spec and no SDK; the portal is a Rails app that answers every
    /.well-known/*, /openapi.json, /graphql and /mcp probe with its "Oops! We couldn't
    locate your page!" not-found shell (HTML 200 or JSON 404), so none of those 200s is
    a real discovery document.
